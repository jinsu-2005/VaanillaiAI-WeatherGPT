services:
  - type: web
    name: vaanilai-ai-backend
    runtime: python
    rootDir: vaanilaiai/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: HOST
        value: "0.0.0.0"
      - key: RELOAD
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./vaanilai.db"
