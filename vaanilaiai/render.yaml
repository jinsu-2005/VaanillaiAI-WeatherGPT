databases:
  - name: vaanilai-postgres
    databaseName: vaanilai
    user: vaanilai_user
    plan: free

services:
  - type: web
    name: vaanilai-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://vaanilai.ai,https://vaanilaiai.web.app,http://localhost:3000,http://localhost:8080"
      - key: DATABASE_URL
        fromDatabase:
          name: vaanilai-postgres
          property: connectionString
